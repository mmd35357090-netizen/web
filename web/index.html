<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Connect to Friends">
  <meta name="theme-color" content="#4169E1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Connect to Friends">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background:#fff; margin:0; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
    #cfg-splash { position:fixed; inset:0; background:#2C1BF0 url(icons/splash.jpg) center/cover no-repeat; z-index:10; transition:opacity .3s; }
  </style>
  <title>Connect to Friends</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.cfgGoogleInit = function (cid, cb) { window.__cfgG = { cid: cid, cb: cb }; };
    window.cfgGoogleRender = function (el, w) {
      var tries = 0;
      (function go() {
        if (window.google && google.accounts && window.__cfgG) {
          google.accounts.id.initialize({
            client_id: window.__cfgG.cid,
            callback: function (r) { window.__cfgG.cb(r.credential); }
          });
          google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', width: w, text: 'continue_with', shape: 'pill' });
        } else if (tries++ < 100) { setTimeout(go, 100); }
      })();
    };
  </script>
</head>
<body>
  <div id="cfg-splash" role="img" aria-label="Connect to Friends"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var e = document.getElementById('cfg-splash');
      if (e) { e.style.opacity = 0; setTimeout(function () { e.remove(); }, 350); }
    });
    window.cfgShare = function (url, title, text) {
      if (navigator.share) {
        return navigator.share({ url: url, title: title, text: text }).then(
          function () { return true; },
          function (e) { return !!(e && e.name === 'AbortError'); });
      }
      return Promise.resolve(false);
    };
    // one picture from a video (used as the cover of a new video post)
    window.cfgVideoFrame = function (bytes, mime) {
      return new Promise(function (resolve) {
        var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
        var v = document.createElement('video');
        var done = false;
        function fin(r) { if (done) return; done = true; URL.revokeObjectURL(url); resolve(r); }
        v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
        v.onloadedmetadata = function () {
          try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch (e) { fin(null); }
        };
        v.onseeked = function () {
          try {
            var w = v.videoWidth, h = v.videoHeight;
            if (!w || !h) return fin(null);
            var s = Math.min(1, 720 / Math.max(w, h));
            var c = document.createElement('canvas');
            c.width = Math.round(w * s); c.height = Math.round(h * s);
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            c.toBlob(function (b) {
              if (!b) return fin(null);
              b.arrayBuffer().then(function (ab) { fin({ data: new Uint8Array(ab), width: w, height: h }); });
            }, 'image/jpeg', 0.8);
          } catch (e) { fin(null); }
        };
        v.onerror = function () { fin(null); };
        setTimeout(function () { fin(null); }, 20000);
      });
    };
    // true on iPhone/iPad Safari when the site is NOT yet added to the Home Screen
    window.cfgIosInstallable = function () {
      var ua = navigator.userAgent || '';
      var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      return ios && !standalone;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
